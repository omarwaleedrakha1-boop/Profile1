    <script>
    // ================= حماية العميل (Client-Side Security) =================
    (function() {
        'use strict';
        
        // 1. تعطيل زر الفأرة الأيمن
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            return false;
        }, false);

        // 2. تعطيل اختصارات لوحة المفاتيح الخطرة
        const forbiddenKeys = [
            { code: 'F12', ctrl: false, shift: false },
            { code: 'KeyI', ctrl: true, shift: true },
            { code: 'KeyJ', ctrl: true, shift: true },
            { code: 'KeyU', ctrl: true, shift: false },
            { code: 'KeyS', ctrl: true, shift: false },
            { code: 'KeyP', ctrl: true, shift: false },
            { code: 'KeyE', ctrl: true, shift: true }
        ];

        document.addEventListener('keydown', function(e) {
            const isForbidden = forbiddenKeys.some(function(keyObj) {
                return e.code === keyObj.code && 
                       e.ctrlKey === keyObj.ctrl && 
                       e.shiftKey === keyObj.shift;
            });
            
            if (isForbidden) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }
        }, true);

        // 3. Anti-Debugger - فحص间歇ي
        let _debugLoop = setInterval(function() {
            // فحص إذا كان الـ DevTools مفتوح
            const _checkDevTools = function() {
                // طريقة 1: فحص أبعاد النافذة
                if (window.outerWidth - window.innerWidth > 150 || 
                    window.outerHeight - window.innerHeight > 150) {
                    // DevTools مفتوح
                    debugger;
                }
                
                // طريقة 2: فحص console
                const _origConsole = console;
                const _checkInterval = setInterval(function() {
                    // إذا تغير console.warn يعني يوجد تجاوز
                    if (console.warn.toString() !== _origConsole.warn.toString()) {
                        debugger;
                    }
                }, 1000);
                
                return _checkInterval;
            };
            
            // تشغيل الفحص
            _checkDevTools();
        }, 500);

        // 4. حماية إضافية: منع نسخ النص
        document.addEventListener('copy', function(e) {
            e.preventDefault();
            return false;
        }, false);

        document.addEventListener('cut', function(e) {
            e.preventDefault();
            return false;
        }, false);

        document.addEventListener('paste', function(e) {
            e.preventDefault();
            return false;
        }, false);

    })();
    </script>
